server:
  port: 8081

spring:
  application:
    name: bank-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/javaisland_backend
    username: ${DB_USERNAME:bank_admin}
    password: ${DB_PASSWORD:bank_password}
    driver-class-name: org.postgresql.Driver

  messages:
    basename: messages
    encoding: UTF-8
  mvc:
    locale-resolver: accept-header

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/javaisland-realm}
    cookie-name: ${JWT_COOKIE_NAME:bank_token}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000,http://localhost:4200}
  scheduled:
    transfer-cron: ${SCHEDULED_TRANSFER_CRON:0 * * * * *}
  encryption:
    key: ${CARD_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

keycloak:
  realm: ${KEYCLOAK_REALM:javaisland-realm}
  auth-server-url: ${KEYCLOAK_AUTH_URL:http://localhost:8080}
  client-id: ${KEYCLOAK_CLIENT_ID:bank-backend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}